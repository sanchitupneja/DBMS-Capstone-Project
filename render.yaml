# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Hostel Room Allocation System - Render Blueprint (MongoDB / Prisma 6)
#
# Before applying this Blueprint, create a FREE MongoDB Atlas cluster
# (https://www.mongodb.com/atlas) and copy its connection string. You will be
# prompted for it as DATABASE_URL when the Blueprint is created. The URI must
# include the database name, e.g.:
#   mongodb+srv://USER:PASSWORD@cluster.mongodb.net/hostel_allocation_db?retryWrites=true&w=majority
services:
  # ── Express API (Docker) ─────────────────────────────────────────────────
  - type: web
    name: hostel-allocation-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    # docker-entrypoint.sh runs `prisma db push` on start (MongoDB has no migrations).
    initialDeployHook: npm run db:seed
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"

  # ── Next.js frontend ─────────────────────────────────────────────────────
  - type: web
    name: hostel-allocation-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: export NEXT_PUBLIC_API_URL="${API_URL:-https://hostel-allocation-api.onrender.com}/api" && npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: API_URL
        fromService:
          name: hostel-allocation-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_API_URL
        value: https://hostel-allocation-api.onrender.com/api
