# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Hostel Room Allocation System - Render Blueprint
# All secrets (DB passwords, JWT keys) are generated by Render at sync time.
services:
  # ── MariaDB (private service, persistent disk) ───────────────────────────
  - type: pserv
    name: hostel-allocation-db
    runtime: image
    image:
      url: mariadb:11
    plan: 0.5c-512mb
    envVars:
      - key: MARIADB_DATABASE
        value: hostel_allocation_db
      - key: MARIADB_USER
        value: hostel_app
      - key: MARIADB_PASSWORD
        generateValue: true
      - key: MARIADB_ROOT_PASSWORD
        generateValue: true
    disk:
      name: hostel-mariadb-data
      mountPath: /var/lib/mysql
      sizeGB: 5

  # ── Express API (Docker) ─────────────────────────────────────────────────
  - type: web
    name: hostel-allocation-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    # Migrations run in docker-entrypoint.sh on every start (works on free plan).
    initialDeployHook: npm run db:seed
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DB_HOST
        fromService:
          name: hostel-allocation-db
          type: pserv
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        fromService:
          name: hostel-allocation-db
          type: pserv
          envVarKey: MARIADB_USER
      - key: DB_PASSWORD
        fromService:
          name: hostel-allocation-db
          type: pserv
          envVarKey: MARIADB_PASSWORD
      - key: DB_NAME
        fromService:
          name: hostel-allocation-db
          type: pserv
          envVarKey: MARIADB_DATABASE
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"

  # ── Next.js frontend ─────────────────────────────────────────────────────
  - type: web
    name: hostel-allocation-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: NEXT_PUBLIC_API_URL="${API_URL}/api" npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: API_URL
        fromService:
          name: hostel-allocation-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
